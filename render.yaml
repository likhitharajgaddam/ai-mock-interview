services:
  - type: web
    name: ai-mock-interview
    runtime: python
    buildCommand: "./build.sh"
    startCommand: >-
      gunicorn ai_mock.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
      --log-level info
      --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: ai_mock.settings
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
